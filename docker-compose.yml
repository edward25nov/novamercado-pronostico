# NovaMercado · servicio de pronóstico diario de ventas.
# Todo el producto se levanta con:  cp .env.example .env && docker compose up -d
name: novamercado

x-airflow-comun: &airflow-comun
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: novamercado-airflow:0.1
  environment: &airflow-entorno
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Los DAGs se disparan desde /admin/reentrenar: deben quedar activos al crearse.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USUARIO:?definir en .env}:${AIRFLOW_DB_CLAVE:?definir en .env}@airflow-db/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRETO:?definir en .env}
    AIRFLOW__API_AUTH__JWT_ISSUER: novamercado
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 30
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Lección del Lab 1: scikit-learn con todos los núcleos deja sin heartbeat a la tarea.
    OMP_NUM_THREADS: 4
    PYTHONPATH: /opt/novamercado/src
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # config.py arma la URL de la base del producto desde estas partes (codificando la clave).
    PRODUCTO_DB_HOST: db
    PRODUCTO_DB_USUARIO: ${PRODUCTO_DB_USUARIO:?definir en .env}
    PRODUCTO_DB_CLAVE: ${PRODUCTO_DB_CLAVE:?definir en .env}
    PRODUCTO_DB_NOMBRE: ${PRODUCTO_DB_NOMBRE:?definir en .env}
    NOVAMERCADO_DATOS: /datos/publicados
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/novamercado/src:ro
    - ./datos/publicados:/datos/publicados:ro
    - airflow-logs:/opt/airflow/logs
  # UID fijo de la imagen oficial: los logs van en un volumen con nombre (D1), así que no hace
  # falta adaptarlo al anfitrión, y cambiarlo dejaría el volumen sin permisos de escritura.
  user: "50000:0"
  restart: unless-stopped
  depends_on:
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # --- Base de datos del producto
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${PRODUCTO_DB_USUARIO:?definir en .env}
      POSTGRES_PASSWORD: ${PRODUCTO_DB_CLAVE:?definir en .env}
      POSTGRES_DB: ${PRODUCTO_DB_NOMBRE:?definir en .env}
    volumes:
      - producto-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- MLflow: tracking y Model Registry (el nombre del servicio lo fija el enunciado)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PUERTO_HOST:-5000},127.0.0.1,127.0.0.1:${MLFLOW_PUERTO_HOST:-5000}"
    ports:
      - "${MLFLOW_PUERTO_HOST:-5000}:5000"
    volumes:
      - mlflow-datos:/mlflow
    # La imagen no trae curl: se consulta /health con Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # --- Inicializador: corre una vez en cada `up` y termina. Aplica el esquema y carga los archivos
  # publicados solo si cambiaron (D5). Usa la misma imagen que la API.
  inicializador:
    image: novamercado-api:0.1
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["python", "-m", "novamercado.inicializador"]
    environment:
      PRODUCTO_DB_HOST: db
      PRODUCTO_DB_USUARIO: ${PRODUCTO_DB_USUARIO:?definir en .env}
      PRODUCTO_DB_CLAVE: ${PRODUCTO_DB_CLAVE:?definir en .env}
      PRODUCTO_DB_NOMBRE: ${PRODUCTO_DB_NOMBRE:?definir en .env}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      NOVAMERCADO_DATOS: /datos/publicados
      OMP_NUM_THREADS: 4
    volumes:
      - ./datos/publicados:/datos/publicados:ro
    # No depende de mlflow en el compose: lo espera en el código, y en los arranques siguientes no
    # lo necesita (estado_producto), así un reinicio con MLflow caído no falla.
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # --- API del servicio. Solo depende de la base: arranca aunque MLflow o Airflow no estén.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: novamercado-api:0.1
    environment:
      PRODUCTO_DB_HOST: db
      PRODUCTO_DB_USUARIO: ${PRODUCTO_DB_USUARIO:?definir en .env}
      PRODUCTO_DB_CLAVE: ${PRODUCTO_DB_CLAVE:?definir en .env}
      PRODUCTO_DB_NOMBRE: ${PRODUCTO_DB_NOMBRE:?definir en .env}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_URL: http://airflow-apiserver:8080
      AIRFLOW_USUARIO: ${AIRFLOW_ADMIN_USUARIO:?definir en .env}
      AIRFLOW_CLAVE: ${AIRFLOW_ADMIN_CLAVE:?definir en .env}
    ports:
      - "8000:8000"
    volumes:
      - api-cache:/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Airflow 3 (LocalExecutor) con su propia base de datos
  airflow-db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USUARIO:?definir en .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_CLAVE:?definir en .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comun
    # El entrypoint oficial migra la base y crea el usuario antes de correr el comando.
    command: version
    environment:
      <<: *airflow-entorno
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USUARIO:?definir en .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_CLAVE:?definir en .env}
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-comun
    command: api-server
    ports:
      - "${AIRFLOW_PUERTO_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-comun
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-comun
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

volumes:
  producto-db:
  mlflow-datos:
  api-cache:
  airflow-db:
  airflow-logs:
