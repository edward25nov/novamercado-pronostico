name: pruebas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # pytest devuelve 5 cuando aún no hay pruebas (fase F0)
      - run: pytest -q || [ $? -eq 5 ]
